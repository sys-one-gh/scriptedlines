# ─────────────────────────────────────────────────────────────
# docker-compose.yml
# ScriptedLines — full stack dev environment
#
# Services:
#   backend  → FastAPI + uvicorn (hot reload)  → connects to Supabase
#   frontend → Vite dev server (hot reload)
#   db       → PostgreSQL 16 (OPTIONAL local fallback, profile-gated)
#
# Usage:
#   docker-compose up -d                       → start backend + frontend (uses Supabase)
#   docker-compose --profile local-db up -d    → also start a local Postgres
#   docker-compose down                        → stop
#   docker-compose logs backend                → view backend logs
#
# The database now lives on Supabase. DATABASE_URL is read from
# .env and points at the shared cloud database, so WSL and Mac
# both connect to the same source of truth. The local `db` service
# is kept only as an optional offline fallback (profile: local-db).
# ─────────────────────────────────────────────────────────────

services:

  # ── FastAPI Backend ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scriptedlines_backend
    restart: unless-stopped
    environment:
      # Comes straight from .env — points at Supabase (or local-db if you override)
      DATABASE_URL:   ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM:  HS256
      ENV:            ${ENV:-development}
    volumes:
      # Hot reload — edits on host reflected immediately
      - ./backend:/app
      # PDF storage — persists separately from code
      - storage_data:/app/storage
    ports:
      - "8000:8000"
    # No depends_on — backend connects to remote Supabase, nothing local to wait for.

  # ── Vite Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scriptedlines_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      # Hot reload — edits on host reflected immediately
      - ./frontend:/app
      # Prevent node_modules from being overwritten by host mount
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # ── PostgreSQL 16 — OPTIONAL local fallback ───────────────
  # Only starts when you explicitly run:
  #   docker-compose --profile local-db up -d
  # If you use this, also point DATABASE_URL in .env back at:
  #   postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  db:
    image: postgres:16-alpine
    container_name: scriptedlines_db
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Named volume — data persists across restarts and rebuilds
      - pgdata:/var/lib/postgresql/data
      # Init scripts run once on first startup (empty DB only)
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

# ── Named Volumes ─────────────────────────────────────────────
volumes:
  pgdata:
    name: scriptedlines_pgdata
  storage_data:
    name: scriptedlines_storage
# ─────────────────────────────────────────────────────────────
# docker-compose.yml
# ScriptedLines — full stack dev environment
#
# Services:
#   db       → PostgreSQL 16
#   backend  → FastAPI + uvicorn (hot reload)
#   frontend → Vite dev server (hot reload)
#
# Usage:
#   docker-compose up           → start all services
#   docker-compose up -d        → start in background
#   docker-compose down         → stop (data preserved)
#   docker-compose down -v      → ⚠️  stop AND delete database
#   docker-compose logs backend → view backend logs
# ─────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 16 ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: scriptedlines_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Named volume — data persists across restarts and rebuilds
      - pgdata:/var/lib/postgresql/data
      # Init scripts run once on first startup (empty DB only)
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Expose to host so you can still use pgAdmin or psql directly
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scriptedlines_backend
    restart: unless-stopped
    environment:
      DATABASE_URL:    postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY:  ${JWT_SECRET_KEY}
      JWT_ALGORITHM:   HS256
      ENV:             development
    volumes:
      # Hot reload — edits on host reflected immediately
      - ./backend:/app
      # PDF storage — persists separately from code
      - storage_data:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ── Vite Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scriptedlines_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      # Hot reload — edits on host reflected immediately
      - ./frontend:/app
      # Prevent node_modules from being overwritten by host mount
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

# ── Named Volumes ─────────────────────────────────────────────
volumes:
  pgdata:
    name: scriptedlines_pgdata
  storage_data:
    name: scriptedlines_storage
